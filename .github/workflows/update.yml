name: Update financial headlines

on:
  schedule:
    # 11:00 UTC = 7:00 AM ET (adjust if you're in a different timezone)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run fetch

      - name: Commit updated headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/headlines.json
          git diff --staged --quiet || git commit -m "Update headlines $(date -u +%Y-%m-%d)"
          git push
